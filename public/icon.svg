<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050b14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#050b14" />
  
  <!-- Outer Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#arcGlow)" />
  <circle cx="256" cy="256" r="195" stroke="#083344" stroke-width="4" fill="none" opacity="0.8" />
  <circle cx="256" cy="256" r="185" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.7" />

  <!-- Outer Reactor Ring -->
  <circle cx="256" cy="256" r="160" stroke="#0e7490" stroke-width="12" fill="#031d2e" filter="url(#neonBlur)" />

  <!-- 10 Coils around Ring -->
  <g transform="translate(256, 256)" stroke="#38bdf8" stroke-width="8" stroke-linecap="round">
    <line x1="0" y1="-146" x2="0" y2="-174" />
    <line x1="91" y1="-125" x2="108" y2="-149" />
    <line x1="146" y1="-47" x2="174" y2="-56" />
    <line x1="146" y1="47" x2="174" y2="56" />
    <line x1="91" y1="125" x2="108" y2="149" />
    <line x1="0" y1="146" x2="0" y2="174" />
    <line x1="-91" y1="125" x2="-108" y2="149" />
    <line x1="-146" y1="47" x2="-174" y2="56" />
    <line x1="-146" y1="-47" x2="-174" y2="-56" />
    <line x1="-91" y1="-125" x2="-108" y2="-149" />
  </g>

  <!-- Middle Ring -->
  <circle cx="256" cy="256" r="120" stroke="#06b6d4" stroke-width="6" fill="#04273b" />
  <circle cx="256" cy="256" r="105" stroke="#22d3ee" stroke-width="2" stroke-dasharray="14 8" fill="none" />

  <!-- Inner Triangular Reactor Core Elements -->
  <polygon points="256,160 338,304 174,304" stroke="#38bdf8" stroke-width="5" fill="none" opacity="0.85" />
  <polygon points="256,312 338,168 174,168" stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.6" />

  <!-- Central Luminous Core -->
  <circle cx="256" cy="256" r="48" fill="url(#coreGlow)" filter="url(#neonBlur)" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" />
</svg>
